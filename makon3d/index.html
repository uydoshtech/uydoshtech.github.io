<!doctype html>
<html lang="en" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Makon3D</title>
    <meta name="description" content="Makon3D — view LiDAR room scans in 3D." />
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script src="../assets/theme-init.js?v=20260711-1"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="stylesheet" href="../assets/makon3d.css?v=20260725-7" />
  </head>
  <body>
    <div class="m3d-app">
      <header class="m3d-header">
        <button
          type="button"
          class="m3d-nav-trigger"
          id="m3d-nav-trigger"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-label="Menu"
          data-i18n="aria.menu"
          data-i18n-attr="aria-label"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <button type="button" class="m3d-back" id="m3d-back" hidden aria-label="Back" data-i18n="aria.back" data-i18n-attr="aria-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <div class="m3d-brand">
          <!-- Inline copy of makon3d_mobile/assets/branding/makon3d_logo.svg,
               refilled with currentColor so it follows the accent color. -->
          <span class="m3d-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 538 538" fill="currentColor" aria-hidden="true">
              <g transform="translate(25,0)">
                <g transform="translate(0,538) scale(0.1,-0.1)" stroke="none">
                  <path d="M1744 4392 c-380 -229 -691 -421 -692 -427 -2 -10 1374 -845 1392 -845 10 0 1364 816 1383 834 10 8 -14 27 -98 79 l-110 67 -462 -277 c-254 -153 -471 -278 -482 -278 -21 0 -474 264 -475 277 0 4 209 132 465 285 255 153 464 280 464 283 0 5 -671 413 -686 417 -4 1 -319 -186 -699 -415z M600 2656 l0 -984 292 -173 c160 -96 295 -175 300 -177 4 -2 8 301 8 673 0 373 4 675 9 673 4 -1 117 -68 250 -148 l241 -145 2 -684 3 -685 370 -221 369 -220 368 220 367 220 1 833 c0 457 3 832 6 832 3 0 115 -66 250 -146 l244 -147 0 -528 c0 -291 2 -529 5 -529 3 0 138 79 300 175 l295 176 0 986 0 985 -22 -14 c-13 -8 -426 -257 -920 -552 l-896 -538 -849 508 c-466 279 -881 527 -920 551 l-73 43 0 -984z"/>
                </g>
              </g>
            </svg>
          </span>
          <div class="m3d-brand-copy">
            <h1 class="m3d-title" id="m3d-title">MakonAI</h1>
            <span class="m3d-tagline" data-i18n="tagline">Ваше пространство в 3D</span>
          </div>
        </div>
        <!-- Filled with the Telegram user's photo by makon3d.js when available. -->
        <span class="m3d-avatar" id="m3d-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
          </svg>
        </span>
      </header>

      <main class="m3d-main">
        <section class="m3d-list-panel" id="m3d-list-panel" aria-label="Scans" data-i18n="aria.scans" data-i18n-attr="aria-label">
          <!-- Scan-flow feedback banner (QR code / status) — filled by
               makon3d.js while an App Clip scan session is live and fixed
               above the bottom bar via makon3d.css. Scans are started from
               inside a project (per room, or entire home). -->
          <div class="m3d-scan-cta" id="m3d-scan-cta" hidden></div>
          <div class="m3d-status" id="m3d-status" role="status" aria-label="Loading scans"><span class="m3d-loading-spinner" aria-hidden="true"></span></div>
          <ul class="m3d-list" id="m3d-list" hidden></ul>
        </section>

        <section class="m3d-viewer-panel" id="m3d-viewer-panel" hidden aria-label="3D view" data-i18n="aria.view3d" data-i18n-attr="aria-label">
          <div class="m3d-viewer-wrap" id="m3d-viewer-wrap"></div>
          <div class="m3d-viewer-meta" id="m3d-viewer-meta"></div>
          <!-- Floor/wall tile estimate, ported from makon3d_mobile's
               RoomMaterialsScreen — filled by renderMaterialsPanel (makon3d.js). -->
          <section class="m3d-materials" id="m3d-materials" hidden aria-label="Material estimate" data-i18n="mat.title" data-i18n-attr="aria-label"></section>
        </section>
      </main>
    </div>

    <!-- Floating "new project" button (home list only) — mirrors the app's
         create-project action; handled by initCreateProject (makon3d.js). -->
    <button
      type="button"
      class="m3d-fab"
      id="m3d-fab"
      hidden
      aria-label="New project"
      data-i18n="create.title"
      data-i18n-attr="aria-label"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>

    <!-- New-project dialog: name + scan mode, saved via the same project
         backup endpoint the app syncs through. -->
    <div class="m3d-create-backdrop" id="m3d-create-backdrop" hidden aria-hidden="true">
      <div class="m3d-create-card" role="dialog" aria-modal="true" aria-labelledby="m3d-create-title">
        <h2 class="m3d-create-title" id="m3d-create-title" data-i18n="create.title">New project</h2>
        <label class="m3d-create-label" for="m3d-create-name" data-i18n="create.nameLabel">Project name</label>
        <input
          type="text"
          class="m3d-create-input"
          id="m3d-create-name"
          maxlength="80"
          autocomplete="off"
          data-i18n="create.namePlaceholder"
          data-i18n-attr="placeholder"
        />
        <div class="m3d-create-label" id="m3d-create-mode-label" data-i18n="create.modeLabel">Scan mode</div>
        <div class="m3d-seg m3d-create-mode" id="m3d-create-mode" role="tablist" aria-labelledby="m3d-create-mode-label">
          <button type="button" class="m3d-seg-btn is-active" role="tab" aria-selected="true" data-mode="entireHousing" data-i18n="project.mode.entireHousing">Entire home</button>
          <button type="button" class="m3d-seg-btn" role="tab" aria-selected="false" data-mode="roomByRoom" data-i18n="project.mode.roomByRoom">Room by room</button>
        </div>
        <p class="m3d-create-error" id="m3d-create-error" hidden></p>
        <div class="m3d-create-actions">
          <button type="button" class="m3d-create-cancel" id="m3d-create-cancel" data-i18n="create.cancel">Cancel</button>
          <button type="button" class="m3d-scan-cta-btn m3d-create-submit" id="m3d-create-submit" data-i18n="create.submit">Create</button>
        </div>
      </div>
    </div>

    <!-- Room type picker for "Add room" in room-by-room projects — mirrors
         the app's RoomTypeSelectionScreen; options built by makon3d.js. -->
    <div class="m3d-create-backdrop" id="m3d-roomtype-backdrop" hidden aria-hidden="true">
      <div class="m3d-create-card" role="dialog" aria-modal="true" aria-labelledby="m3d-roomtype-title">
        <h2 class="m3d-create-title" id="m3d-roomtype-title" data-i18n="roomType.title">Select room type</h2>
        <div class="m3d-roomtype-options" id="m3d-roomtype-options"></div>
        <div class="m3d-create-actions">
          <button type="button" class="m3d-create-cancel" id="m3d-roomtype-cancel" data-i18n="create.cancel">Cancel</button>
        </div>
      </div>
    </div>

    <div class="m3d-drawer-backdrop" id="m3d-drawer-backdrop" hidden aria-hidden="true">
      <div class="m3d-drawer" role="dialog" aria-modal="true" aria-label="Menu" data-i18n="aria.menu" data-i18n-attr="aria-label">
        <div class="m3d-drawer-header">
          <span class="m3d-avatar m3d-drawer-avatar" id="m3d-drawer-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
            </svg>
          </span>
          <strong class="m3d-drawer-username" id="m3d-drawer-username" hidden></strong>
        </div>
        <nav class="m3d-drawer-body" role="menu">
          <a role="menuitem" href="/makon3d/" id="m3d-drawer-home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
            <span data-i18n="drawer.scans">Scans</span>
          </a>
          <a role="menuitem" href="mailto:uydoshtech@gmail.com">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" />
            </svg>
            <span data-i18n="drawer.contact">Contact</span>
          </a>
          <a role="menuitem" href="/privacy-policy.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
            <span data-i18n="drawer.privacy">Privacy Policy</span>
          </a>
          <a role="menuitem" href="/terms-of-service.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" />
            </svg>
            <span data-i18n="drawer.terms">Terms of Service</span>
          </a>
        </nav>
        <!-- Language picker — built by initDrawerLangPicker (makon3d.js). -->
        <div class="m3d-drawer-lang">
          <div class="m3d-drawer-lang-label" data-i18n="drawer.language">Language</div>
          <div
            class="m3d-drawer-lang-options"
            id="m3d-drawer-lang-options"
            role="radiogroup"
            aria-label="Language"
            data-i18n="drawer.language"
            data-i18n-attr="aria-label"
          ></div>
        </div>
      </div>
    </div>

    <script src="../assets/uydosh-core.js?v=20260716-1"></script>
    <!-- Shared with listing.html: the 2D vector blueprint floor plan the
         viewer's 2D toggle mounts (mountRoomScanBlueprint & co). -->
    <script src="../assets/listing-detail-floorplan.js?v=20260715-1" defer></script>
    <script src="../assets/makon3d.js?v=20260725-7" defer></script>
  </body>
</html>
