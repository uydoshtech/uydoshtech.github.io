<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>UyDosh — Chat</title>
    <meta name="description" content="UyDosh group chat — Telegram Mini App." />
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script src="../assets/theme-init.js?v=20260930-avatar-ring"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="stylesheet" href="../assets/loading-spinner.css?v=20260929-shared-spinner" />
    <link rel="stylesheet" href="../assets/telegram-shared.css?v=20260930-avatar-ring" />
    <link rel="stylesheet" href="../assets/telegram-account.css?v=20261001-landlord-role" />
    <link rel="stylesheet" href="../assets/telegram-chat.css?v=20261001-chat-quote-clip" />
    <link rel="stylesheet" href="../assets/listing-rating.css?v=20261001-chat-rating" />
  </head>
  <body class="chat-page">
    <div class="wrap chat-wrap">
      <button type="button" class="chat-peer-header content-gutter" data-chat-peer-header hidden></button>

      <div id="loading" class="status" aria-busy="true" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
      </div>

      <div id="chat-error" class="status error" hidden></div>

      <div id="chat-thread" class="chat-thread content-gutter" hidden></div>
    </div>

    <form id="chat-composer" class="chat-composer" hidden>
      <div id="chat-reply-bar" class="chat-reply-bar" hidden></div>
      <div class="chat-composer-row">
      <textarea
        id="chat-input"
        rows="1"
        maxlength="2000"
        data-i18n="chat.placeholder"
        data-i18n-attr="placeholder"
        autocomplete="off"
      ></textarea>
      <button
        type="submit"
        class="chat-send"
        data-icon="paperPlane"
        data-i18n="chat.send"
        data-i18n-attr="aria-label"
        aria-label="Send"
      >      </button>
      </div>
    </form>

    <div id="group-participants-root" hidden></div>

    <script src="../assets/uydosh-core.js?v=20260930-avatar-ring"></script>
    <script src="../assets/uydosh-i18n.js?v=20261002-saved-by-gender"></script>
    <script src="../assets/uydosh-api.js?v=20261001-chat-rating" defer></script>
    <script src="../assets/uydosh-icons.js?v=20260928-1" defer></script>
    <script src="../assets/uydosh-mini-app.js?v=20260930-back-swipe" defer></script>
    <script src="../assets/uydosh-profile-match.js?v=20260928-1" defer></script>
    <script type="module" src="../assets/telegram-account.js?v=20261001-landlord-role"></script>
    <script src="../assets/listing-detail-discovery.js?v=20261002-saved-by-gender" defer></script>
    <script src="../assets/telegram-chat.js?v=20261002-listing-rate" defer></script>
  </body>
</html>
