<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UyDosh — Profile</title>
    <meta name="description" content="Your UyDosh profile — Telegram Mini App." />
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script>
      // Apply a saved manual UI theme (mini app header sun/moon toggle) before first paint to
      // avoid a flash. This only affects the app's own interface colors — the map's light/dark
      // rendering is independent and is never controlled by this toggle.
      (function () {
        try {
          var uiTheme = localStorage.getItem('uydosh_manual_theme');
          var vars = uiTheme === 'dark'
            ? { '--bg': '#061525', '--fg': 'rgba(255, 255, 255, 0.92)', '--muted': 'rgba(255, 255, 255, 0.7)', '--card': 'rgba(255, 255, 255, 0.06)', '--stroke': 'rgba(255, 255, 255, 0.12)' }
            : uiTheme === 'light'
              ? { '--bg': '#f6f7fb', '--fg': 'rgba(15, 23, 42, 0.92)', '--muted': 'rgba(15, 23, 42, 0.7)', '--card': 'rgba(15, 23, 42, 0.04)', '--stroke': 'rgba(15, 23, 42, 0.12)' }
              : null;
          if (vars) {
            var root = document.documentElement;
            for (var prop in vars) root.style.setProperty(prop, vars[prop]);
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../assets/telegram-shared.css?v=20260705-89" />
    <style>
      :root {
        --error: #f87171;
        --profile-footer-height: 72px;
      }
      body {
        padding-bottom: calc(var(--profile-footer-height) + 12px + env(safe-area-inset-bottom, 0));
      }
      .wrap {
        padding-bottom: 24px;
      }
      #loading:not(.error) {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100dvh - var(--uydosh-tg-inset-top, 0px) - 160px);
        padding: 0;
      }
      .status {
        text-align: center;
        color: var(--muted);
        padding: 40px 16px;
        font-size: 14px;
      }
      .status.error { color: var(--error); }
      .status-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 16px;
        padding: 12px 20px;
        border-radius: 12px;
        border: 0;
        background: var(--brand2);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .status-cta:active { opacity: 0.9; }
      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 2.5px solid color-mix(in srgb, var(--fg) 16%, transparent);
        border-top-color: var(--brand2);
        border-radius: 50%;
        animation: profile-spin 0.75s linear infinite;
      }
      @keyframes profile-spin {
        to { transform: rotate(360deg); }
      }
      .content-gutter {
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      .profile-intro {
        margin: 6px 0 18px;
        color: var(--fg);
        font-size: 19px;
        font-weight: 800;
        line-height: 1.3;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
      }
      .field .field-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }
      .field-label-icon,
      .chip-icon {
        display: inline-flex;
        flex-shrink: 0;
      }
      .field-label-icon svg,
      .chip-icon svg {
        width: 13px;
        height: 13px;
        display: block;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        appearance: none;
        border: 1px solid var(--stroke);
        background: rgba(127, 127, 127, 0.08);
        border-radius: 999px;
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12.5px;
        font-weight: 700;
        line-height: 1.2;
        padding: 6px 12px;
      }
      .chip[aria-pressed="true"] {
        border-color: var(--brand);
        background: color-mix(in srgb, var(--brand2) 12%, transparent);
        color: var(--fg);
      }
      input[type="text"] {
        width: 100%;
        border: 1px solid var(--stroke);
        background: rgba(127, 127, 127, 0.08);
        color: var(--fg);
        border-radius: 12px;
        padding: 11px 12px;
        font: inherit;
        font-size: 15px;
        box-sizing: border-box;
      }
      input[type="text"]:focus {
        outline: 2px solid color-mix(in srgb, var(--brand) 45%, transparent);
        outline-offset: 1px;
      }
      .university-picked {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--stroke);
        border-radius: 14px;
        background: color-mix(in srgb, var(--brand2) 8%, transparent);
        margin-bottom: 10px;
        font-weight: 700;
        font-size: 14px;
      }
      .university-picked .icon {
        flex-shrink: 0;
        display: inline-flex;
        color: var(--brand2);
      }
      .university-picked .icon svg { width: 20px; height: 20px; display: block; }
      .university-picked-name { flex: 1; min-width: 0; }
      .university-search-wrap {
        position: relative;
      }
      /* Autosuggest dropdown: only shown once the user types something (see
         telegram-profile.js) — floats over whatever's below it instead of
         permanently occupying page space like a full always-visible list. */
      .station-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        z-index: 20;
        max-height: 260px;
        overflow: auto;
        border: 1px solid var(--stroke, rgba(127, 127, 127, 0.35));
        border-radius: 14px;
        padding: 8px;
        background: color-mix(in srgb, var(--bg), black 6%);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }
      .station-list-empty {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        padding: 24px 12px;
      }
      .station-item {
        appearance: none;
        border: 1px solid transparent;
        background: transparent;
        color: var(--fg);
        border-radius: 10px;
        padding: 9px 12px;
        text-align: left;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        cursor: pointer;
        width: 100%;
      }
      .station-item[aria-pressed="true"] {
        border-color: var(--brand);
        background: rgba(127, 127, 127, 0.1);
      }
      .lifestyle-slider-wrap {
        position: relative;
      }
      .lifestyle-slider {
        width: 100%;
        accent-color: var(--brand2);
        display: block;
        margin: 2px 0 6px;
        position: relative;
        z-index: 0;
      }
      /* Small dots overlaid on top of the track marking each of the 1-5
         stops the slider can land on — purely decorative, so they ignore
         pointer events (to not block dragging) and sit above the input via
         z-index (the thumb itself still renders on top, being a child of
         the browser's own track rendering, not affected by our z-index). */
      .lifestyle-slider-ticks {
        position: absolute;
        left: 3px;
        right: 3px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        z-index: 1;
      }
      .lifestyle-slider-tick {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--bg);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--fg) 30%, transparent);
      }
      .lifestyle-slider-value {
        font-size: 13px;
        font-weight: 700;
        color: var(--brand2);
        min-height: 18px;
      }
      .profile-more-note {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border: 1px dashed var(--stroke);
        border-radius: 14px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }
      .form-error-banner,
      .form-success-banner {
        position: fixed;
        z-index: 100;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(var(--profile-footer-height) + 8px + env(safe-area-inset-bottom, 0px));
        width: min(692px, calc(100% - 28px));
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
      }
      .form-error-banner {
        background: color-mix(in srgb, var(--error) 14%, var(--bg));
        border: 1px solid color-mix(in srgb, var(--error) 42%, transparent);
        color: var(--error);
      }
      .form-success-banner {
        background: color-mix(in srgb, var(--brand2) 16%, var(--bg));
        border: 1px solid color-mix(in srgb, var(--brand2) 45%, transparent);
        color: var(--brand2);
      }
      .profile-footer {
        position: fixed;
        z-index: 90;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0));
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        border-top: 1px solid var(--stroke);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .profile-footer-inner {
        max-width: 720px;
        margin: 0 auto;
      }
      .wizard-btn {
        appearance: none;
        border: 0;
        border-radius: 20px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        line-height: 1;
        min-height: 48px;
        padding: 14px 18px;
        background: var(--brand2);
        color: #fff;
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      .wizard-btn:active:not(:disabled) {
        opacity: 0.9;
        transform: scale(0.98);
      }
      .wizard-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .wizard-btn-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.28);
        border-top-color: #fff;
        border-radius: 50%;
        animation: profile-spin 0.75s linear infinite;
        flex-shrink: 0;
      }
      /*
       * `.field`/`.university-picked` set their own `display` (flex), which —
       * being an author rule — otherwise wins over the browser's default
       * `[hidden] { display: none }` (a user-agent rule) regardless of
       * selector specificity. Without this, toggling `.hidden` via JS on
       * these elements had no visual effect at all.
       */
      #loading[hidden],
      #form-root[hidden],
      #profile-footer[hidden],
      #university-field[hidden],
      #university-picked[hidden],
      #university-list[hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header
        data-uydosh-mini-app-header
        data-uydosh-header-subtitle="profile.title"
      ></header>

      <div id="loading" class="status" aria-busy="true" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
      </div>

      <div id="form-root" hidden>
        <p class="profile-intro content-gutter" data-i18n="profile.subtitle"></p>

        <div class="view-tabs" role="tablist" aria-label="Profile">
          <button type="button" class="view-tab" role="tab" data-profile-tab="basic" aria-selected="true">
            <span class="view-tab-icon" aria-hidden="true" data-icon="person"></span>
            <span data-i18n="profile.tabs.basic"></span>
          </button>
          <button type="button" class="view-tab" role="tab" data-profile-tab="lifestyle" aria-selected="false">
            <span class="view-tab-icon" aria-hidden="true" data-icon="sparkles"></span>
            <span data-i18n="profile.tabs.lifestyle"></span>
          </button>
        </div>

        <div id="tab-basic" class="content-gutter">
          <div class="field">
            <div class="field-label" data-i18n="profile.studentQuestion"></div>
            <div class="chips">
              <button type="button" class="chip" id="student-yes" aria-pressed="false" data-i18n="profile.studentYes"></button>
              <button type="button" class="chip" id="student-no" aria-pressed="false" data-i18n="profile.studentNo"></button>
            </div>
          </div>

          <div class="field" id="university-field" hidden>
            <div class="field-label" data-i18n="profile.universityLabel"></div>
            <div id="university-picked" class="university-picked" hidden>
              <span class="icon" aria-hidden="true" data-icon="graduationCap"></span>
              <span class="university-picked-name" id="university-picked-name"></span>
            </div>
            <div class="university-search-wrap">
              <input
                type="text"
                id="university-search"
                data-i18n="profile.universitySearchPlaceholder"
                data-i18n-attr="placeholder"
                autocomplete="off"
              />
              <div class="station-list" id="university-list" hidden></div>
            </div>
          </div>
        </div>

        <div id="tab-lifestyle" class="content-gutter" hidden>
          <div id="lifestyle-fields"></div>
          <div class="profile-more-note" data-i18n="profile.lifestyle.moreComingSoon"></div>
        </div>
      </div>

      <div id="form-error" class="form-error-banner" role="alert" hidden></div>
      <div id="form-success" class="form-success-banner" role="status" hidden></div>
    </div>

    <footer id="profile-footer" class="profile-footer" hidden>
      <div class="profile-footer-inner">
        <button type="button" class="wizard-btn" id="save-btn">
          <span id="save-btn-label" data-i18n="profile.save"></span>
          <span class="wizard-btn-spinner" id="save-btn-spinner" hidden></span>
        </button>
      </div>
    </footer>

    <script src="../assets/uydosh-core.js?v=20260705-97"></script>
    <script src="../assets/uydosh-api.js?v=20260705-97"></script>
    <script src="../assets/uydosh-i18n.js?v=20260705-20"></script>
    <script src="../assets/uydosh-icons.js?v=20260705-96"></script>
    <script src="../assets/uydosh-map-pins.js?v=20260705-80"></script>
    <script src="../assets/uydosh-badges.js?v=20260703-67"></script>
    <script src="../assets/uydosh-mini-app.js?v=20260705-99"></script>
    <script src="../assets/telegram-profile.js?v=20260705-8"></script>
  </body>
</html>
