<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>UyDosh — Profile</title>
    <meta name="description" content="Your UyDosh profile — Telegram Mini App." />
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script src="../assets/theme-init.js?v=20260711-1"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="stylesheet" href="../assets/telegram-shared.css?v=20260829-1" />
    <link rel="stylesheet" href="../assets/telegram-profile.css?v=20260905-2" />
  </head>
  <body>
    <div class="wrap">
      <header
        data-uydosh-mini-app-header
        data-uydosh-header-subtitle="profile.title"
      ></header>

      <div id="loading" class="status" aria-busy="true" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
      </div>

      <div id="form-root" hidden>
        <div class="view-tabs" role="tablist" aria-label="Profile">
          <button type="button" class="view-tab" role="tab" data-profile-tab="basic" data-haptic="selection" aria-selected="true">
            <span class="view-tab-icon" aria-hidden="true" data-icon="person"></span>
            <span data-i18n="profile.tabs.basic"></span>
          </button>
          <button type="button" class="view-tab" role="tab" data-profile-tab="lifestyle" data-haptic="selection" aria-selected="false">
            <span class="view-tab-icon" aria-hidden="true" data-icon="sparkles"></span>
            <span data-i18n="profile.tabs.lifestyle"></span>
          </button>
        </div>

        <div id="tab-basic" class="content-gutter">
          <div class="field">
            <div class="field-label" data-i18n="profile.nameOrNickname"></div>
            <input
              type="text"
              id="name-input"
              maxlength="100"
              autocomplete="name"
              data-i18n="profile.nameOrNickname"
              data-i18n-attr="placeholder"
            />
          </div>

          <div class="field">
            <div class="field-label" data-i18n="profile.gender"></div>
            <div class="chips">
              <button type="button" class="chip" id="gender-male" data-haptic="selection" aria-pressed="false" data-i18n="profile.genderMale"></button>
              <button type="button" class="chip" id="gender-female" data-haptic="selection" aria-pressed="false" data-i18n="profile.genderFemale"></button>
            </div>
          </div>

          <div class="field">
            <div class="profile-lang-wrap">
              <div class="profile-lang-row" aria-hidden="true">
                <span class="profile-lang-lead">
                  <span data-i18n="profile.imFrom"></span>
                </span>
                <span class="profile-lang-value" id="profile-region-name"></span>
                <span class="icon profile-lang-chevron" data-icon="chevronDown"></span>
              </div>
              <label class="profile-lang-select-label">
                <span class="visually-hidden" data-i18n="profile.imFrom"></span>
                <select id="profile-region-select" class="profile-lang-select"></select>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="field-label" data-i18n="profile.studentQuestion"></div>
            <div class="chips">
              <button type="button" class="chip" id="student-yes" data-haptic="selection" aria-pressed="false" data-i18n="profile.studentYes"></button>
              <button type="button" class="chip" id="student-no" data-haptic="selection" aria-pressed="false" data-i18n="profile.studentNo"></button>
            </div>
          </div>

          <div class="field" id="university-field" hidden>
            <div class="field-label" data-i18n="profile.universityLabel"></div>
            <div class="university-search-wrap">
              <span class="icon university-search-icon" aria-hidden="true" data-icon="graduationCap"></span>
              <input
                type="text"
                id="university-search"
                data-i18n="profile.universitySearchPlaceholder"
                data-i18n-attr="placeholder"
                autocomplete="off"
              />
              <div class="station-list" id="university-list" hidden></div>
            </div>
          </div>

          <div class="field">
            <div class="field-label" data-i18n="profile.aboutMe"></div>
            <textarea
              id="about-me-input"
              rows="3"
              maxlength="1000"
              data-i18n="profile.aboutMePlaceholder"
              data-i18n-attr="placeholder"
            ></textarea>
          </div>

          <div class="field">
            <div class="profile-lang-wrap">
              <div class="profile-lang-row" aria-hidden="true">
                <span class="profile-lang-lead">
                  <span class="icon" data-icon="globe"></span>
                  <span data-i18n="profile.language"></span>
                </span>
                <span class="profile-lang-value">
                  <span id="profile-lang-flag"></span>
                  <span id="profile-lang-name"></span>
                </span>
                <span class="icon profile-lang-chevron" data-icon="chevronDown"></span>
              </div>
              <label class="profile-lang-select-label">
                <span class="visually-hidden" data-i18n="profile.language"></span>
                <select id="profile-lang-select" class="profile-lang-select">
                  <option value="uz">🇺🇿 O'zbekcha</option>
                  <option value="ru">🇷🇺 Русский</option>
                  <option value="en">🇺🇸 English</option>
                </select>
              </label>
            </div>
          </div>

          <div class="field">
            <div class="profile-lang-wrap">
              <div class="profile-lang-row" aria-hidden="true">
                <span class="profile-lang-lead">
                  <span class="icon" data-icon="house"></span>
                  <span data-i18n="profile.roleLabel"></span>
                </span>
                <span class="profile-lang-value" id="profile-role-name"></span>
                <span class="icon profile-lang-chevron" data-icon="chevronDown"></span>
              </div>
              <label class="profile-lang-select-label">
                <span class="visually-hidden" data-i18n="profile.roleLabel"></span>
                <select id="profile-role-select" class="profile-lang-select"></select>
              </label>
            </div>
          </div>
        </div>

        <div id="tab-lifestyle" class="content-gutter" hidden>
          <div id="lifestyle-fields"></div>

          <section id="looking-for" class="looking-for">
            <h2 class="looking-for-title" data-i18n="profile.looking.title"></h2>
            <p class="looking-for-sub" data-i18n="profile.looking.subtitle"></p>

            <div class="field">
              <div class="field-label" data-i18n="profile.looking.roommateGender"></div>
              <div class="chips" id="looking-gender-chips"></div>
            </div>

            <div class="field">
              <div class="field-label" data-i18n="profile.looking.birthYear"></div>
              <input
                type="number"
                id="birth-year-input"
                inputmode="numeric"
                min="1900"
                max="2100"
                step="1"
                data-i18n="profile.looking.birthYearHint"
                data-i18n-attr="placeholder"
              />
            </div>

            <div class="field">
              <div class="field-label" data-i18n="profile.looking.ageRange"></div>
              <div class="profile-range-row">
                <input
                  type="number"
                  id="pref-age-min-input"
                  inputmode="numeric"
                  min="0"
                  max="120"
                  step="1"
                  data-i18n="profile.looking.from"
                  data-i18n-attr="placeholder"
                />
                <input
                  type="number"
                  id="pref-age-max-input"
                  inputmode="numeric"
                  min="0"
                  max="120"
                  step="1"
                  data-i18n="profile.looking.to"
                  data-i18n-attr="placeholder"
                />
              </div>
            </div>

            <div class="field">
              <div class="field-label" data-i18n="profile.looking.budgetRange"></div>
              <div class="profile-range-row">
                <input
                  type="number"
                  id="budget-min-input"
                  inputmode="numeric"
                  min="0"
                  max="100000000"
                  step="1"
                  data-i18n="profile.looking.from"
                  data-i18n-attr="placeholder"
                />
                <input
                  type="number"
                  id="budget-max-input"
                  inputmode="numeric"
                  min="0"
                  max="100000000"
                  step="1"
                  data-i18n="profile.looking.to"
                  data-i18n-attr="placeholder"
                />
              </div>
            </div>

            <div class="field">
              <div class="field-label" data-i18n="profile.looking.budgetOverlap"></div>
              <div class="chips" id="looking-overlap-chips"></div>
            </div>

            <div class="field looking-dealbreakers">
              <div class="field-label" data-i18n="profile.looking.dealbreakers"></div>
              <p class="looking-for-hint" data-i18n="profile.looking.dealbreakersHint"></p>
              <div class="chips" id="looking-dealbreaker-chips"></div>
            </div>

            <div class="field">
              <div class="field-label" data-i18n="profile.looking.priorities"></div>
              <p class="looking-for-hint" data-i18n="profile.looking.prioritiesHint"></p>
              <div class="chips" id="looking-priority-chips"></div>
            </div>
          </section>
        </div>
      </div>

      <div id="view-root" class="profile-view content-gutter" hidden></div>

    </div>

    <footer id="profile-footer" class="profile-footer" hidden>
      <div class="profile-footer-inner">
        <button type="button" class="wizard-btn wizard-btn-next" id="save-btn" data-haptic="medium">
          <span id="save-btn-label" data-i18n="profile.save"></span>
          <span class="wizard-btn-spinner" id="save-btn-spinner" hidden></span>
        </button>
      </div>
    </footer>

    <script src="../assets/uydosh-core.js?v=20260709-102"></script>
    <script src="../assets/uydosh-i18n.js?v=20260905-1"></script>
    <script src="../assets/uydosh-api.js?v=20260829-1" defer></script>
    <script src="../assets/uydosh-icons.js?v=20260828-2" defer></script>
    <script src="../assets/uydosh-map-pins.js?v=20260723-3" defer></script>
    <script src="../assets/uydosh-badges.js?v=20260714-69" defer></script>
    <script src="../assets/uydosh-mini-app.js?v=20260905-8" defer></script>
    <script src="../assets/telegram-profile.js?v=20260905-1" defer></script>
  </body>
</html>
