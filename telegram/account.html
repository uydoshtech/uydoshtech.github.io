<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>UyDosh — Account</title>
    <meta name="description" content="Your own listings on UyDosh — Telegram Mini App." />
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script src="../assets/theme-init.js?v=20260711-1"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="stylesheet" href="../assets/telegram-shared.css?v=20260707-107" />
    <link rel="stylesheet" href="../assets/telegram-account.css?v=20260707-107" />
  </head>
  <body>
    <div class="wrap">
      <header
        data-uydosh-mini-app-header
        data-uydosh-header-subtitle="account.subtitle"
      ></header>

      <div class="view-tabs" role="tablist" aria-label="Account">
        <button type="button" class="view-tab" role="tab" data-account-tab="mine" data-haptic="selection" aria-selected="true">
          <span class="view-tab-icon" aria-hidden="true" data-icon="house"></span>
          <span data-i18n="account.tabs.mine">Мои объявления</span>
        </button>
        <button type="button" class="view-tab" role="tab" data-account-tab="favorites" data-haptic="selection" aria-selected="false">
          <span class="view-tab-icon" aria-hidden="true" data-icon="heartOutline"></span>
          <span data-i18n="account.tabs.favorites">Избранное</span>
        </button>
      </div>

      <div id="loading" class="status" aria-busy="true" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
      </div>

      <div id="account-empty" class="account-empty" hidden>
        <p id="account-empty-text"></p>
        <a id="account-empty-cta" class="btn-link" href="/telegram/create.html" data-i18n="create.postListing" hidden></a>
      </div>

      <div id="account-list" class="account-list content-gutter" hidden></div>
    </div>

    <script src="../assets/uydosh-core.js?v=20260709-102"></script>
    <script src="../assets/uydosh-i18n.js?v=20260710-1"></script>
    <script src="../assets/uydosh-api.js?v=20260711-1" defer></script>
    <script src="../assets/uydosh-icons.js?v=20260709-110" defer></script>
    <script src="../assets/uydosh-map-pins.js?v=20260709-4" defer></script>
    <script src="../assets/uydosh-badges.js?v=20260709-68" defer></script>
    <script src="../assets/uydosh-mini-app.js?v=20260710-1" defer></script>
    <script src="../assets/telegram-account.js?v=20260709-101" defer></script>
  </body>
</html>
