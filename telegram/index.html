<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>UyDosh</title>
    <script>
      if (new URLSearchParams(location.search).get('search') === 'group') {
        document.documentElement.classList.add('group-housing-search');
      }
    </script>
    <meta name="description" content="UyDosh ijara e’lonlari — Telegram Mini App." />
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <meta name="uydosh-yandex-maps-key" content="70aaf6ac-5a4b-4a69-a5a5-c16536483324" />
    <script src="../assets/theme-init.js?v=20260928-1"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="stylesheet" href="../assets/loading-spinner.css?v=20260929-shared-spinner" />
    <link rel="stylesheet" href="../assets/telegram-shared.css?v=20260929-shared-spinner" />
    <link rel="stylesheet" href="../assets/telegram-index.css?v=20260930-map-fit-pad" />
  </head>
  <body>
    <div class="wrap">
      <header data-uydosh-mini-app-header></header>

      <div class="feed-sticky">
        <section class="filters" id="filters" aria-label="Filters"></section>
      </div>

      <div class="view-tabs" role="tablist" aria-label="View">
        <button type="button" class="view-tab" role="tab" data-view="list" data-haptic="selection" aria-selected="true">
          <span class="view-tab-icon" aria-hidden="true" data-icon="list"></span>
          <span data-i18n="view.list">Список</span>
        </button>
        <button type="button" class="view-tab" role="tab" data-view="map" data-haptic="selection" aria-selected="false">
          <span class="view-tab-icon" aria-hidden="true" data-icon="mapPin"></span>
          <span data-i18n="view.map">Карта</span>
        </button>
      </div>

      <main>
        <div class="feed-list-panel" id="feed-list-panel">
          <div class="grid" id="grid" aria-live="polite"></div>
          <div class="status" id="status" role="status"></div>
          <div id="sentinel" aria-hidden="true"></div>
        </div>
        <div class="feed-map-panel" id="feed-map-panel" aria-label="Map">
          <div class="map-container" id="feed-map"></div>
          <button
            type="button"
            class="map-locate-banner"
            id="feed-map-locate-banner"
            hidden
          >
            <span class="map-locate-banner-icon" aria-hidden="true" data-icon="mapPin"></span>
            <span data-i18n="map.locate.cta">Показать моё местоположение</span>
          </button>
          <div class="map-pin-tooltip" id="feed-map-tooltip" hidden></div>
          <div class="feed-map-status" id="feed-map-status" hidden></div>
        </div>
        <script>
          (function () {
            try {
              if (localStorage.getItem('uydosh_tg_feed_view') !== 'map') return;
            } catch (e) { return; }
            document.body.classList.add('view-map');
            var listTab = document.querySelector('[data-view="list"]');
            var mapTab = document.querySelector('[data-view="map"]');
            if (listTab) listTab.setAttribute('aria-selected', 'false');
            if (mapTab) mapTab.setAttribute('aria-selected', 'true');
            var listPanel = document.getElementById('feed-list-panel');
            var mapPanel = document.getElementById('feed-map-panel');
            var filters = document.getElementById('filters');
            if (listPanel) listPanel.classList.add('hidden');
            if (mapPanel) mapPanel.classList.add('active');
            if (filters) filters.classList.add('filters--map-view');
          })();
        </script>
      </main>
    </div>

    <a
      class="fab-create"
      id="fab-create"
      href="/telegram/create.html"
      data-i18n="create.postListing"
      data-i18n-attr="aria-label"
      data-icon="plus"
    ></a>

    <button
      type="button"
      class="scroll-top-btn"
      id="scroll-top-btn"
      aria-hidden="true"
      data-i18n="feed.scrollToTop"
      data-i18n-attr="aria-label"
      data-icon="chevronUp"
    ></button>

    <script src="../assets/uydosh-core.js?v=20260929-search-districts"></script>
    <script src="../assets/uydosh-i18n.js?v=20260929-language-switch"></script>
    <script src="../assets/uydosh-api.js?v=20260930-pin-repaint" defer></script>
    <script src="../assets/uydosh-icons.js?v=20260928-1" defer></script>
    <script src="../assets/uydosh-map-pins.js?v=20260930-roommate-fill" defer></script>
    <script src="../assets/uydosh-badges.js?v=20260930-absent-outline" defer></script>
    <script src="../assets/listing-discovery.js?v=20260929-group-search" defer></script>
    <script src="../assets/uydosh-mini-app.js?v=20260930-back-swipe" defer></script>
    <script src="../assets/telegram-feed.js?v=20260930-photo-type-label" defer></script>
  </body>
</html>
