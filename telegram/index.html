<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UyDosh</title>
    <meta name="description" content="UyDosh ijara e’lonlari — Telegram Mini App." />
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <meta name="uydosh-yandex-maps-key" content="70aaf6ac-5a4b-4a69-a5a5-c16536483324" />
    <script>
      // Apply a saved manual UI theme (mini app header sun/moon toggle) before first paint to
      // avoid a flash. This only affects the app's own interface colors — the map's light/dark
      // rendering is independent and is never controlled by this toggle.
      (function () {
        try {
          var uiTheme = localStorage.getItem('uydosh_manual_theme');
          var vars = uiTheme === 'dark'
            ? { '--bg': '#061525', '--fg': 'rgba(255, 255, 255, 0.92)', '--muted': 'rgba(255, 255, 255, 0.7)', '--card': 'rgba(255, 255, 255, 0.06)', '--stroke': 'rgba(255, 255, 255, 0.12)' }
            : uiTheme === 'light'
              ? { '--bg': '#f6f7fb', '--fg': 'rgba(15, 23, 42, 0.92)', '--muted': 'rgba(15, 23, 42, 0.7)', '--card': 'rgba(15, 23, 42, 0.04)', '--stroke': 'rgba(15, 23, 42, 0.12)' }
              : null;
          if (vars) {
            var root = document.documentElement;
            for (var prop in vars) root.style.setProperty(prop, vars[prop]);
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../assets/telegram-shared.css?v=20260706-105" />
    <link rel="stylesheet" href="../assets/telegram-index.css?v=20260705-103" />
  </head>
  <body>
    <div class="wrap">
      <header data-uydosh-mini-app-header></header>

      <div class="feed-sticky">
        <section class="filters" id="filters" aria-label="Filters"></section>
      </div>

      <div class="view-tabs" role="tablist" aria-label="View">
        <button type="button" class="view-tab" role="tab" data-view="list" data-haptic="selection" aria-selected="true">
          <span class="view-tab-icon" aria-hidden="true" data-icon="list"></span>
          <span data-i18n="view.list">Список</span>
        </button>
        <button type="button" class="view-tab" role="tab" data-view="map" data-haptic="selection" aria-selected="false">
          <span class="view-tab-icon" aria-hidden="true" data-icon="mapPin"></span>
          <span data-i18n="view.map">Карта</span>
        </button>
      </div>

      <main>
        <div class="feed-list-panel" id="feed-list-panel">
          <div class="grid" id="grid" aria-live="polite"></div>
          <div class="status" id="status" role="status"></div>
          <div id="sentinel" aria-hidden="true"></div>
        </div>
        <div class="feed-map-panel" id="feed-map-panel" aria-label="Map">
          <div class="map-container" id="feed-map"></div>
          <button
            type="button"
            class="map-locate-banner"
            id="feed-map-locate-banner"
            hidden
          >
            <span class="map-locate-banner-icon" aria-hidden="true" data-icon="mapPin"></span>
            <span data-i18n="map.locate.cta">Показать моё местоположение</span>
          </button>
          <div class="map-pin-tooltip" id="feed-map-tooltip" hidden></div>
          <div class="feed-map-status" id="feed-map-status" hidden></div>
        </div>
      </main>
    </div>

    <a
      class="fab-create"
      id="fab-create"
      href="/telegram/create.html"
      data-i18n="create.postListing"
      data-i18n-attr="aria-label"
      data-icon="plus"
    ></a>

    <button
      type="button"
      class="scroll-top-btn"
      id="scroll-top-btn"
      aria-hidden="true"
      data-i18n="feed.scrollToTop"
      data-i18n-attr="aria-label"
      data-icon="chevronUp"
    ></button>

    <script src="../assets/uydosh-core.js?v=20260706-100"></script>
    <script src="../assets/uydosh-api.js?v=20260706-103"></script>
    <script src="../assets/uydosh-i18n.js?v=20260706-31"></script>
    <script src="../assets/uydosh-icons.js?v=20260706-105"></script>
    <script src="../assets/uydosh-map-pins.js?v=20260705-81"></script>
    <script src="../assets/uydosh-badges.js?v=20260703-67"></script>
    <script src="../assets/uydosh-mini-app.js?v=20260706-104"></script>
    <script src="../assets/telegram-feed-map.js?v=20260705-67"></script>
    <script src="../assets/telegram-feed.js?v=20260706-104"></script>
  </body>
</html>
