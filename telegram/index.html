    <script>
      // Apply a saved manual UI theme (mini app header sun/moon toggle) before first paint to
      // avoid a flash. This only affects the app's own interface colors — the map's light/dark
      // rendering is independent and is never controlled by this toggle.
      (function () {
        try {
          var uiTheme = localStorage.getItem('uydosh_manual_theme');
          var vars = uiTheme === 'dark'
            ? { '--bg': '#061525', '--fg': 'rgba(255, 255, 255, 0.92)', '--muted': 'rgba(255, 255, 255, 0.7)', '--card': 'rgba(255, 255, 255, 0.06)', '--stroke': 'rgba(255, 255, 255, 0.12)' }
            : uiTheme === 'light'
              ? { '--bg': '#f6f7fb', '--fg': 'rgba(15, 23, 42, 0.92)', '--muted': 'rgba(15, 23, 42, 0.7)', '--card': 'rgba(15, 23, 42, 0.04)', '--stroke': 'rgba(15, 23, 42, 0.12)' }
              : null;
          if (vars) {
            var root = document.documentElement;
            for (var prop in vars) root.style.setProperty(prop, vars[prop]);
          }
        } catch (e) { /* ignore */ }
      })();
    </script>

      .feed-map-panel {
        display: none;
        position: relative;
        min-height: 360px;
        height: calc(100dvh - var(--uydosh-tg-sticky-top, 0px) - 220px);
        max-height: 640px;
        border: 1px solid var(--stroke);
        border-radius: 16px;
        overflow: hidden;
        background: rgba(127, 127, 127, 0.06);
        /* Stop a finger-drag on the map from also chaining into a page-level
           bounce/rubber-band scroll (and the toolbar show/hide + viewport
           resize that comes with it) — see touch-action note below for why
           that combination is the main cause of panning stutter. */
        overscroll-behavior: contain;
      }
      .feed-map-panel.active { display: block; }
      .feed-map-panel .map-container {
        width: 100%;
        height: 100%;
        /* Without this, the browser has to wait to see whether a finger-drag
           over the map is a page scroll or a map pan (default `touch-action:
           auto`), and on some WebViews (Telegram iOS in particular) that
           ambiguity intermittently resolves as "also scroll the page" —
           triggering a toolbar show/hide + `100dvh` resize mid-gesture, whose
           resize handler (syncFeedMapPanelHeight) then forces a synchronous
           layout read on the very frames the map is trying to animate a pan.
           `none` tells the browser up front that this element owns all touch
           gestures, so Yandex Maps' own drag handling never competes with
           native scrolling. Scoped to the map div only (not the whole panel)
           so it doesn't also disable the pin tooltip carousel's own swipe. */
        touch-action: none;

        min-width: 0;
        font-size: 1em;
        font-weight: 800;
        line-height: 1;
        color: var(--price-green);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .map-pin-tooltip-title {
        font-size: 14px;
        font-weight: 800;
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .map-pin-tooltip-meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
      }
      .map-pin-tooltip-meta span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .map-pin-tooltip-meta .icon {
        width: 13px;
        height: 13px;
        display: inline-block;
        flex: 0 0 auto;
      }
      .map-pin-tooltip-meta .icon svg {
        width: 13px;
        height: 13px;
        display: block;
      }
      .map-pin-tooltip-meta .icon svg * {
        stroke: currentColor;
        fill: none;
      }
      .map-pin-tooltip-meta .dotsep::before {
        content: "•";
        margin-right: 4px;
        opacity: 0.6;
      }
      .map-pin-tooltip-date {
        flex-basis: 100%;
      }
      .feed-list-panel.hidden { display: none; }
      .feed-list-panel {
        /* Standard content gutter (see .content-gutter in telegram-shared.css) so
           list/grid content lines up with the filter ribbon and view tabs above it. */
        padding-left: var(--content-gutter-offset);
        padding-right: var(--content-gutter-offset);
      }
      .feed-list-panel.is-empty {
        display: flex;
        flex-direction: column;
        min-height: calc(100dvh - var(--uydosh-tg-sticky-top, 0px) - 240px);
      }
      .feed-list-panel.is-empty .grid:empty {
        display: none;
      }
      .feed-list-panel.is-empty .status.is-empty-state {
        flex: 1;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
      .card {
        border: 1px solid var(--stroke);
        background: var(--card);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .card:active { opacity: 0.92; }
      .card .thumb {
        aspect-ratio: 4 / 3;
        width: 100%;
        background: linear-gradient(135deg, rgba(96, 165, 250, 0.12), rgba(225, 29, 46, 0.08));
        position: relative;
        overflow: hidden;
      }
      .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card-photo-dots {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        pointer-events: none;
        z-index: 2;
      }
      .card-photo-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.75);
        background: rgba(255, 255, 255, 0.45);
        box-sizing: border-box;
        flex: 0 0 auto;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      .card-photo-dot[aria-current="true"] {
        background: #fff;
      }
      .card .thumb.empty::after {
        content: "UyDosh";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.12em;
      }
      .featured-badge {
        position: absolute;
        top: 8px;
        left: 8px;
        background: linear-gradient(135deg, #e11d2e, #f97316);
        color: white;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 999px;
        text-transform: uppercase;
      }
      .type-badge {
        position: absolute;
        top: 8px;
        left: 8px;
        display: inline-flex;
        align-items: center;
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.15;
        border: 1px solid var(--badge-type-color, var(--stroke));
        color: var(--badge-type-color, var(--muted));
        background: color-mix(in srgb, var(--badge-type-color, var(--muted)) 32%, rgba(8, 10, 14, 0.88));
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      /* When a listing is also featured, that ribbon already claims the
         top-left corner — stack the type badge underneath it instead of
         overlapping. */
      .featured-badge + .type-badge {
        top: 36px;
      }
      .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
      .card .title-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .card .title {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        flex: 1;
        min-width: 0;
      }
      .card .price {
        flex-shrink: 0;
        font-size: 16px;
        font-weight: 800;
        color: var(--price-green);
        white-space: nowrap;
      }
      .card .price small { font-weight: 500; font-size: 12px; color: var(--price-green); opacity: 0.85; margin-left: 2px; }
      .card .meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
      }
      .card .meta span { display: inline-flex; align-items: center; gap: 4px; }
      .card .meta .icon {
        width: 13px;
        height: 13px;
        display: inline-block;
        color: var(--muted);
        opacity: 0.95;
        flex: 0 0 auto;
      }
      .card .meta .icon svg { width: 13px; height: 13px; display: block; }
      .card .meta .icon svg * { stroke: currentColor; fill: none; }
      .card .meta .dotsep::before { content: "•"; margin-right: 4px; opacity: 0.6; }
      .card .card-footer {
        margin-top: 8px;
        padding-top: 10px;
        border-top: 1px solid color-mix(in srgb, var(--muted) 28%, transparent);
      }
      .card .amenity-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        margin-top: 0;
        color: var(--muted);
      }
      .card .amenity-row-icons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        flex: 1 1 auto;
        min-width: 0;
      }
      .card .card-posted {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        flex: 0 0 auto;
      }
      .card .card-posted .icon {
        width: 14px;
        height: 14px;
      }
      .card .amenity-inline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .card .amenity-more {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }

      .skeleton {
        border: 1px solid var(--stroke);
        background: var(--card);
        border-radius: 16px;
        overflow: hidden;
      }
      .skeleton .thumb, .skeleton .line {
        background: linear-gradient(90deg, rgba(127,127,127,0.06), rgba(127,127,127,0.14), rgba(127,127,127,0.06));
        background-size: 200% 100%;
        animation: shimmer 1.2s linear infinite;
      }
      .skeleton .thumb { aspect-ratio: 4/3; }
      .skeleton .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
      .skeleton .line { height: 10px; border-radius: 6px; }
      .skeleton .line.w60 { width: 60%; }
      .skeleton .line.w40 { width: 40%; }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      .status {
        margin: 20px 0;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        min-height: 24px;
      }
      .status .btn {
        margin-top: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 14px;
        border-radius: 12px;
        border: 1px solid var(--stroke);
        background: rgba(127, 127, 127, 0.1);
        color: var(--fg);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      #sentinel {
        height: 1px;
        width: 100%;
        pointer-events: none;
      }

      .fab-create {
        position: fixed;
        right: max(14px, env(safe-area-inset-right, 0px));
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        z-index: 30;
        appearance: none;
        border: 0;
        border-radius: 50%;
        background: linear-gradient(135deg, #38bdf8, #60a5fa);
        color: #fff;
        width: 48px;
        height: 48px;
        padding: 0;
        box-shadow: 0 8px 24px rgba(96, 165, 250, 0.35);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }
      .fab-create[hidden],
      body.view-map .fab-create {
        display: none !important;
        pointer-events: none;
      }
      .fab-create:active { opacity: 0.92; transform: scale(0.98); }
      .fab-create svg {
        width: 22px;
        height: 22px;
        display: block;
      }

      .scroll-top-btn {
        position: fixed;
        right: max(14px, env(safe-area-inset-right, 0px));
        bottom: calc(76px + env(safe-area-inset-bottom, 0px));
        z-index: 29;
        appearance: none;
        border: 1px solid var(--stroke);
        border-radius: 50%;
        background: color-mix(in srgb, var(--card) 72%, var(--bg));
        color: var(--muted);
        width: 36px;
        height: 36px;
        padding: 0;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transform: scale(0.88);
        transition:
          opacity 160ms ease,
          transform 160ms cubic-bezier(0.33, 1, 0.68, 1);
      }
      .scroll-top-btn.visible {
        opacity: 1;
        pointer-events: auto;
        transform: scale(1);
      }
      .scroll-top-btn:active { opacity: 0.88; }
      body.view-map .scroll-top-btn {
        display: none !important;
        pointer-events: none;
      }
      .scroll-top-btn svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      .scroll-top-btn svg * {
        stroke: currentColor;
        fill: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .scroll-top-btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header data-uydosh-mini-app-header></header>

      <div class="feed-sticky">
        <section class="filters" id="filters" aria-label="Filters"></section>
      </div>

      <div class="view-tabs" role="tablist" aria-label="View">
        <button type="button" class="view-tab" role="tab" data-view="list" aria-selected="true">
          <span class="view-tab-icon" aria-hidden="true" data-icon="list"></span>
          <span data-i18n="view.list">Список</span>
        </button>
        <button type="button" class="view-tab" role="tab" data-view="map" aria-selected="false">
          <span class="view-tab-icon" aria-hidden="true" data-icon="mapPin"></span>
          <span data-i18n="view.map">Карта</span>
        </button>
      </div>

      <main>
        <div class="feed-list-panel" id="feed-list-panel">
          <div class="grid" id="grid" aria-live="polite"></div>
          <div class="status" id="status" role="status"></div>
          <div id="sentinel" aria-hidden="true"></div>
        </div>
        <div class="feed-map-panel" id="feed-map-panel" aria-label="Map">
          <div class="map-container" id="feed-map"></div>
          <button
            type="button"
            class="map-locate-banner"
            id="feed-map-locate-banner"
            hidden
          >
            <span class="map-locate-banner-icon" aria-hidden="true" data-icon="mapPin"></span>
            <span data-i18n="map.locate.cta">Показать моё местоположение</span>
          </button>
          <div class="map-pin-tooltip" id="feed-map-tooltip" hidden></div>
          <div class="feed-map-status" id="feed-map-status" hidden></div>
        </div>
      </main>
    </div>

    <a
      class="fab-create"
      id="fab-create"
      href="/telegram/create.html"
      data-i18n="create.postListing"
      data-i18n-attr="aria-label"
      data-icon="plus"
    ></a>

    <button
      type="button"
      class="scroll-top-btn"
      id="scroll-top-btn"
      aria-hidden="true"
      data-i18n="feed.scrollToTop"
      data-i18n-attr="aria-label"
      data-icon="chevronUp"
    ></button>

    <script src="../assets/uydosh-core.js?v=20260704-68"></script>
    <script src="../assets/uydosh-api.js?v=20260704-81"></script>
    <script src="../assets/uydosh-i18n.js?v=20260704-10"></script>
    <script src="../assets/uydosh-icons.js?v=20260705-82"></script>
    <script src="../assets/uydosh-map-pins.js?v=20260704-76"></script>
    <script src="../assets/uydosh-badges.js?v=20260703-67"></script>
    <script src="../assets/uydosh-mini-app.js?v=20260705-83"></script>
    <script src="../assets/telegram-feed-map.js?v=20260704-66"></script>
    <script src="../assets/telegram-feed.js?v=20260704-66"></script>
  </body>
