<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>UyDosh — Добавить хостел</title>
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script src="../assets/theme-init.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="stylesheet" href="../assets/telegram-shared.css?v=20260830-4" />
    <link
      rel="stylesheet"
      href="../assets/telegram-hostel-create.css?v=20260905-5"
    />
  </head>
  <body>
    <div class="wrap">
      <header data-uydosh-mini-app-header></header>
      <main class="hostel-create">
        <h1>Добавить хостел</h1>
        <div id="access" class="status">Проверяем доступ…</div>
        <form id="form" hidden>
          <label
            >Название<input
              name="name"
              required
              maxlength="160"
              placeholder="Например, Hostel Tashkent" /></label
          ><label class="address-field"
            ><span>Адрес</span>
            <div class="address-row">
              <input name="address" required placeholder="Улица, дом" />
              <button
                type="button"
                id="use-location"
                aria-label="Определить мою локацию"
                title="Моя локация"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="6"></circle>
                  <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
                  <circle
                    cx="12"
                    cy="12"
                    r="1.5"
                    class="location-center"
                  ></circle>
                </svg>
              </button></div></label
          ><label
            ><span>Телефон</span>
            <div class="phone-input-wrap phone-input-wrap-split">
              <span class="phone-flag" aria-hidden="true">🇺🇿</span>
              <span class="phone-code-prefix">+998</span>
              <input
                name="phone"
                type="tel"
                inputmode="numeric"
                autocomplete="tel-national"
                placeholder="(90)-123-45-67"
              /></div></label
          ><button
            type="button"
            class="btn-ghost hostel-phone-share"
            id="hostel-phone-share"
          >
            ☎ Поделиться номером телефона</button
          ><label
            >Telegram<input
              name="telegram_username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              maxlength="33"
              placeholder="@username"
          /></label>
          <fieldset class="gender-policy">
            <legend>Политика размещения</legend>
            <div class="gender-pills">
              <label class="gender-pill gender-pill--male"
                ><input
                  type="radio"
                  name="gender_policy"
                  value="male"
                  checked
                /><span>Мужской</span></label
              >
              <label class="gender-pill gender-pill--female"
                ><input type="radio" name="gender_policy" value="female" /><span
                  >Женский</span
                ></label
              >
              <label class="gender-pill gender-pill--mixed"
                ><input type="radio" name="gender_policy" value="mixed" /><span
                  >Смешанный</span
                ></label
              >
            </div>
          </fieldset>
          <section
            class="hostel-photo-upload"
            aria-labelledby="hostel-photo-label"
          >
            <div id="hostel-photo-label" class="hostel-photo-label">Фото</div>
            <input
              id="hostel-photo-input"
              type="file"
              accept="image/*"
              capture="environment"
              multiple
              hidden
            />
            <button
              type="button"
              class="hostel-photo-picker"
              id="hostel-photo-picker"
            >
              <span aria-hidden="true">⌾</span> Снять или выбрать фото
            </button>
            <p class="hostel-photo-hint">
              До 10 фото. Они будут загружены в хранилище UyDosh.
            </p>
            <div
              class="hostel-photo-previews"
              id="hostel-photo-previews"
              aria-live="polite"
            ></div>
          </section>
          <section>
            <div class="section-head">
              <h2>Комнаты и места</h2>
              <button type="button" id="add-unit">+ Комната</button>
            </div>
            <div id="units"></div>
          </section>
          <label
            >Описание<textarea
              name="description_ru"
              required
              maxlength="5000"
              placeholder="Условия, правила, что рядом"
            ></textarea></label
          ><button class="save" type="submit">Создать хостел</button>
          <div id="error" class="form-error" hidden></div>
        </form>
        <script>
          // Server-side authorization still protects creation. This prevents a
          // cached Telegram WebView script from leaving the form blocked.
          document.getElementById("access").hidden = true;
          document.getElementById("form").hidden = false;
        </script>
      </main>
    </div>
    <template id="unit"
      ><div class="unit">
        <input
          name="unit_name"
          required
          placeholder="Например, Мужская комната на 6 мест"
        />
        <div class="unit-grid">
          <input
            name="beds_total"
            type="number"
            min="1"
            required
            placeholder="Всего мест"
          /><input
            name="beds_available"
            type="number"
            min="0"
            required
            placeholder="Свободно"
          /><input
            name="price"
            type="number"
            min="1"
            required
            placeholder="Цена / месяц"
          /><select name="unit_gender">
            <option value="mixed">Смешанная</option>
            <option value="male">Мужская</option>
            <option value="female">Женская</option>
          </select>
        </div>
        <button type="button" class="remove">Удалить</button>
      </div></template
    >
    <script src="../assets/uydosh-core.js?v=20260905-2"></script>
    <script src="../assets/uydosh-i18n.js"></script>
    <script src="../assets/uydosh-api.js?v=20260905-3" defer></script>
    <script src="../assets/uydosh-icons.js" defer></script>
    <script src="../assets/uydosh-map-pins.js?v=20260830-1" defer></script>
    <script src="../assets/uydosh-mini-app.js?v=20260905-5" defer></script>
    <script
      src="../assets/telegram-hostel-create.js?v=20260905-5"
      defer
    ></script>
  </body>
</html>
