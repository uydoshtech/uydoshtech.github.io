<!doctype html><html lang="ru" class="mini-app"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>UyDosh — Добавить хостел</title><meta name="uydosh-api-base" content="https://api.uydosh.com"><script src="../assets/theme-init.js"></script><script src="https://telegram.org/js/telegram-web-app.js" defer></script><link rel="stylesheet" href="../assets/telegram-shared.css"><link rel="stylesheet" href="../assets/telegram-hostel-create.css"></head><body><div class="wrap"><header data-uydosh-mini-app-header></header><main class="hostel-create"><h1>Добавить хостел</h1><p class="intro">Карточка появится в каталоге после сохранения.</p><div id="access" class="status">Проверяем доступ…</div><form id="form" hidden><label>Название<input name="name" required maxlength="160" placeholder="Например, Hostel Tashkent"></label><label>Адрес<textarea name="address" required placeholder="Улица, дом, район"></textarea></label><label>Телефон<input name="phone" inputmode="tel" placeholder="+998…"></label><label>Telegram<input name="telegram_username" placeholder="username"></label><label>Политика размещения<select name="gender_policy"><option value="mixed">Смешанный</option><option value="male">Мужской</option><option value="female">Женский</option></select></label><label>Фото (ссылки, по одной в строке)<textarea name="photos" placeholder="https://…"></textarea></label><section><div class="section-head"><h2>Комнаты и места</h2><button type="button" id="add-unit">+ Комната</button></div><div id="units"></div></section><label>Описание<textarea name="description_ru" required maxlength="5000" placeholder="Условия, правила, что рядом"></textarea></label><button class="save" type="submit">Создать хостел</button><div id="error" class="form-error" hidden></div></form></main></div><template id="unit"><div class="unit"><input name="unit_name" required placeholder="Например, Мужская комната на 6 мест"><div class="unit-grid"><input name="beds_total" type="number" min="1" required placeholder="Всего мест"><input name="beds_available" type="number" min="0" required placeholder="Свободно"><input name="price" type="number" min="1" required placeholder="Цена / месяц"><select name="unit_gender"><option value="mixed">Смешанная</option><option value="male">Мужская</option><option value="female">Женская</option></select></div><button type="button" class="remove">Удалить</button></div></template><script src="../assets/uydosh-core.js"></script><script src="../assets/uydosh-i18n.js"></script><script src="../assets/uydosh-api.js" defer></script><script src="../assets/uydosh-icons.js" defer></script><script src="../assets/uydosh-mini-app.js" defer></script><script src="../assets/telegram-hostel-create.js" defer></script></body></html>
