<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>UyDosh — Управление</title>
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script src="../assets/theme-init.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="stylesheet" href="../assets/telegram-shared.css?v=20260830-4" />
    <link rel="stylesheet" href="../assets/telegram-admin.css" />
  </head>
  <body class="admin-screen">
    <div class="wrap">
      <header data-uydosh-mini-app-header></header>
      <main class="admin-page">
        <h1>Управление</h1>
        <div id="admin-access" class="status">Проверяем доступ…</div>
        <div id="admin-tools" hidden>
          <a class="admin-action" href="/telegram/hostel-create.html"
            ><span aria-hidden="true">＋</span
            ><span
              ><b>Добавить хостел</b
              ><small>Создать карточку и указать свободные места</small></span
            ></a
          ><a class="admin-action" href="/telegram/hostels.html"
            ><span aria-hidden="true">⌂</span
            ><span><b>Хостелы</b><small>Открыть каталог</small></span></a
          >
        </div>
        <script>
          document.getElementById("admin-access").hidden = true;
          document.getElementById("admin-tools").hidden = false;
        </script>
      </main>
    </div>
    <nav class="mini-app-tabbar" data-static-tabbar aria-label="Main">
      <div class="mini-app-tabbar-items has-admin">
        <a
          class="mini-app-tab"
          href="/telegram/?listingTypeId=0"
          data-tabbar-id="housing"
          ><span data-icon="house" aria-hidden="true"></span
          ><span data-i18n="tabbar.housing">Жильё</span></a
        >
        <a
          class="mini-app-tab"
          href="/telegram/account.html?tab=groups"
          data-tabbar-id="community"
          ><span data-icon="users" aria-hidden="true"></span
          ><span data-i18n="tabbar.community">Моё</span></a
        >
        <a
          class="mini-app-tab"
          href="/telegram/chats.html"
          data-tabbar-id="messages"
          ><span data-icon="chatBubbles" aria-hidden="true"></span
          ><span data-i18n="tabbar.messages">Сообщения</span></a
        >
        <a
          class="mini-app-tab"
          href="/telegram/create.html"
          data-tabbar-id="create"
          ><span data-icon="plus" aria-hidden="true"></span
          ><span data-i18n="tabbar.create">Создать</span></a
        >
        <a
          class="mini-app-tab is-active"
          href="/telegram/admin.html"
          data-tabbar-id="admin"
          ><span data-icon="shield" aria-hidden="true"></span
          ><span>Управление</span></a
        >
      </div>
    </nav>
    <script src="../assets/uydosh-core.js"></script>
    <script src="../assets/uydosh-i18n.js"></script>
    <script src="../assets/uydosh-api.js" defer></script>
    <script src="../assets/uydosh-icons.js" defer></script>
    <script src="../assets/uydosh-mini-app.js?v=20260830-4" defer></script>
    <script src="../assets/telegram-admin.js?v=20260830-3" defer></script>
  </body>
</html>
