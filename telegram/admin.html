<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>UyDosh — Управление</title>
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script src="../assets/theme-init.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="stylesheet" href="../assets/loading-spinner.css?v=20260929-shared-spinner" />
    <link rel="stylesheet" href="../assets/telegram-shared.css?v=20260929-shared-spinner" />
    <link rel="stylesheet" href="../assets/telegram-admin.css?v=20261102-admin-categories" />
  </head>
  <body class="admin-screen">
    <div class="wrap">
      <header data-uydosh-mini-app-header></header>
      <main class="admin-page">
        <h1>Управление</h1>
        <div id="admin-access" class="status">Проверяем доступ…</div>
        <div id="admin-tools" hidden>
          <section class="admin-category is-users is-open" data-admin-category>
            <button
              type="button"
              class="admin-category-header"
              data-admin-category-toggle
              aria-expanded="true"
            >
              <span class="admin-category-accent" aria-hidden="true"></span>
              <span class="admin-category-icon" aria-hidden="true" data-admin-icon="users"></span>
              <b>Пользователи и модерация</b>
              <span class="admin-category-chevron" aria-hidden="true" data-admin-icon="chevronDown"></span>
            </button>
            <div class="admin-category-body">
              <a class="admin-row" href="/telegram/admin-users.html">
                <span aria-hidden="true" data-admin-icon="person"></span>
                <span>Пользователи</span>
              </a>
              <a class="admin-row" href="/telegram/admin-locations.html">
                <span aria-hidden="true" data-admin-icon="mapPin"></span>
                <span>Локации пользователей Telegram</span>
              </a>
            </div>
          </section>
          <section class="admin-category is-hostels" data-admin-category>
            <button
              type="button"
              class="admin-category-header"
              data-admin-category-toggle
              aria-expanded="false"
            >
              <span class="admin-category-accent" aria-hidden="true"></span>
              <span class="admin-category-icon" aria-hidden="true" data-admin-icon="house"></span>
              <b>Хостелы</b>
              <span class="admin-category-chevron" aria-hidden="true" data-admin-icon="chevronDown"></span>
            </button>
            <div class="admin-category-body">
              <a class="admin-row" href="/telegram/hostel-create.html">
                <span aria-hidden="true" data-admin-icon="plus"></span>
                <span>Добавить хостел</span>
              </a>
              <a class="admin-row" href="/telegram/hostels.html">
                <span aria-hidden="true" data-admin-icon="house"></span>
                <span>Хостелы</span>
              </a>
            </div>
          </section>
        </div>
        <script>
          document.getElementById("admin-access").hidden = true;
          document.getElementById("admin-tools").hidden = false;
        </script>
      </main>
    </div>
    <script src="../assets/uydosh-core.js?v=20261103-price-dot"></script>
    <script src="../assets/uydosh-i18n.js?v=20261102-admin-menu"></script>
    <script src="../assets/uydosh-api.js" defer></script>
    <script src="../assets/uydosh-icons.js" defer></script>
    <script src="../assets/uydosh-mini-app.js?v=20261102-admin-menu" defer></script>
    <script src="../assets/telegram-admin.js?v=20261102-admin-categories" defer></script>
  </body>
</html>
