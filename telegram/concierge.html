<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>UyDosh — Консьерж</title>
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script src="../assets/theme-init.js?v=20260928-1"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="stylesheet" href="../assets/loading-spinner.css?v=20260929-shared-spinner" />
    <link rel="stylesheet" href="../assets/telegram-shared.css?v=20260929-shared-spinner" />
    <style>
      .concierge-back {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        margin: 4px 0 8px;
        padding: 8px 2px;
        color: var(--fg, #fff);
        text-decoration: none;
        font-weight: 650;
        font-size: 16px;
      }
      .concierge-back svg { width: 20px; height: 20px; display: block; }
      .concierge {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 8px 20px 40px;
        text-align: center;
      }
      .concierge-mark {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #2563eb;
        color: #fff;
      }
      .concierge-mark svg { width: 44px; height: 44px; display: block; }
      .concierge h1 { margin: 4px 0 0; font-size: 28px; }
      .concierge-handle { margin: 0; color: var(--muted); font-size: 15px; }
      .concierge-role { margin: 0; font-size: 16px; font-weight: 650; }
      .concierge-stub {
        margin: 8px 0 0;
        max-width: 360px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }
      .concierge-write {
        margin-top: 12px;
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 12px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header data-uydosh-mini-app-header></header>
      <main class="concierge">
        <a class="concierge-back" href="/telegram/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 6l-6 6 6 6"/>
          </svg>
          <span data-i18n="concierge.back">Назад</span>
        </a>
        <div class="concierge-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4.5 13.2a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <rect x="2.6" y="12.2" width="3.3" height="5.4" rx="1.3" fill="currentColor"/>
            <rect x="18.1" y="12.2" width="3.3" height="5.4" rx="1.3" fill="currentColor"/>
            <circle cx="12" cy="13.4" r="2.15" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M7.4 20.4c.6-2.1 2.2-3.2 4.6-3.2s4 .1 4.6 3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 data-i18n="concierge.title">Алексей</h1>
        <p class="concierge-handle">@Laev_al</p>
        <p class="concierge-role" data-i18n="concierge.role">Персональное сопровождение по поиску квартир</p>
        <p class="concierge-stub" data-i18n="concierge.stub">Заглушка. Здесь будет рассказ об Алексее и о том, как он помогает найти квартиру.</p>
        <button type="button" class="concierge-write" id="concierge-write" data-i18n="concierge.write">Написать Алексею</button>
      </main>
    </div>
    <script src="../assets/uydosh-core.js?v=20261103-price-dot"></script>
    <script src="../assets/uydosh-i18n.js?v=20261104-concierge-back"></script>
    <script src="../assets/uydosh-icons.js?v=20261102-drop-seeker" defer></script>
    <script src="../assets/uydosh-mini-app.js?v=20261104-concierge-back" defer></script>
    <script>
      function leaveConcierge() {
        const ref = document.referrer || '';
        if (window.history.length > 1 && /\/telegram\//.test(ref) && !/concierge\.html/.test(ref)) {
          window.history.back();
          return;
        }
        location.href = '/telegram/';
      }
      document.querySelector('.concierge-back')?.addEventListener('click', (event) => {
        const ref = document.referrer || '';
        if (window.history.length > 1 && /\/telegram\//.test(ref) && !/concierge\.html/.test(ref)) {
          event.preventDefault();
          window.history.back();
        }
      });
      function bootConcierge() {
        try { UyDosh.initTelegramMiniApp(); } catch (err) { console.warn('[UyDosh] concierge init skipped', err); }
        try { UyDosh.applyI18n(); } catch (err) { console.warn('[UyDosh] concierge i18n skipped', err); }
        const webApp = window.Telegram?.WebApp;
        try {
          webApp?.BackButton?.onClick(leaveConcierge);
          webApp?.BackButton?.show();
        } catch { /* ignore */ }
        document.getElementById('concierge-write')?.addEventListener('click', () => {
          const url = 'https://t.me/Laev_al';
          if (typeof webApp?.openTelegramLink === 'function') webApp.openTelegramLink(url);
          else if (typeof webApp?.openLink === 'function') webApp.openLink(url);
          else window.open(url, '_blank', 'noopener,noreferrer');
        });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootConcierge);
      else bootConcierge();
    </script>
  </body>
</html>
