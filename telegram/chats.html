<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />

    <title>UyDosh — Messages</title>
    <meta name="description" content="UyDosh chats — Telegram Mini App." />
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
