<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>UyDosh — Хостелы</title>
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script src="../assets/theme-init.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="stylesheet" href="../assets/telegram-shared.css" />
    <link rel="stylesheet" href="../assets/telegram-hostels.css" />
  </head>
  <body>
    <div class="wrap">
      <header data-uydosh-mini-app-header></header>
      <main>
        <button type="button" class="page-back" id="page-back">
          <span aria-hidden="true">‹</span> Назад
        </button>
        <div class="hostel-heading">
          <h1>Хостелы</h1>
          <p>Свободные места в Ташкенте</p>
        </div>
        <div class="hostel-filters" role="group" aria-label="Тип размещения">
          <button
            type="button"
            class="hostel-filter-pill hostel-filter-pill--all active"
            data-gender=""
          >
            Все
          </button>
          <button
            type="button"
            class="hostel-filter-pill hostel-filter-pill--male"
            data-gender="male"
          >
            Мужские
          </button>
          <button
            type="button"
            class="hostel-filter-pill hostel-filter-pill--female"
            data-gender="female"
          >
            Женские
          </button>
          <button
            type="button"
            class="hostel-filter-pill hostel-filter-pill--mixed"
            data-gender="mixed"
          >
            Смешанные
          </button>
        </div>
        <div id="status" class="status" aria-live="polite"></div>
        <div id="hostels" class="hostel-grid"></div>
      </main>
    </div>
    <script src="../assets/uydosh-core.js"></script>
    <script src="../assets/uydosh-i18n.js"></script>
    <script src="../assets/uydosh-api.js" defer></script>
    <script src="../assets/uydosh-icons.js" defer></script>
    <script src="../assets/uydosh-mini-app.js" defer></script>
    <script src="../assets/telegram-hostels.js" defer></script>
  </body>
</html>
