<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UyDosh — Post listing</title>
    <meta name="description" content="Post a listing on UyDosh — Telegram Mini App." />
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script>
      // Apply a saved manual UI theme (mini app header sun/moon toggle) before first paint to
      // avoid a flash. This only affects the app's own interface colors — the map's light/dark
      // rendering is independent and is never controlled by this toggle.
      (function () {
        try {
          var uiTheme = localStorage.getItem('uydosh_manual_theme');
          var vars = uiTheme === 'dark'
            ? { '--bg': '#061525', '--fg': 'rgba(255, 255, 255, 0.92)', '--muted': 'rgba(255, 255, 255, 0.7)', '--card': 'rgba(255, 255, 255, 0.06)', '--stroke': 'rgba(255, 255, 255, 0.12)' }
            : uiTheme === 'light'
              ? { '--bg': '#f6f7fb', '--fg': 'rgba(15, 23, 42, 0.92)', '--muted': 'rgba(15, 23, 42, 0.7)', '--card': 'rgba(15, 23, 42, 0.04)', '--stroke': 'rgba(15, 23, 42, 0.12)' }
              : null;
          if (vars) {
            var root = document.documentElement;
            for (var prop in vars) root.style.setProperty(prop, vars[prop]);
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="../assets/telegram-shared.css?v=20260706-102" />
    <link rel="stylesheet" href="../assets/telegram-create.css?v=20260705-105" />
  </head>
  <body>
    <div class="wrap">
      <header data-uydosh-mini-app-header></header>

      <div id="loading" class="status" aria-busy="true" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
      </div>

      <div id="form-root" hidden>
        <div class="wizard-header">
          <div class="progress" id="progress" aria-hidden="true"></div>
          <div class="step-head">
            <h1 id="step-title"></h1>
            <small id="step-counter"></small>
          </div>
        </div>
        <div id="step-panels"></div>
      </div>

      <div id="form-error" class="form-error-banner" role="alert" hidden></div>

      <div id="success-root" class="success-panel" hidden>
        <h2 id="success-title" data-i18n="create.success">Объявление отправлено!</h2>
        <p id="success-hint" data-i18n="create.successHint">После модерации оно появится в ленте.</p>
        <p id="success-photo-warning" class="success-photo-warning" hidden></p>
        <div class="success-actions">
          <a class="btn-link primary" id="success-feed" href="/telegram/" data-i18n="create.backToFeed">К объявлениям</a>
          <a class="btn-link" id="success-view" href="/telegram/account.html" data-i18n="create.backToAccount">К моим объявлениям</a>
        </div>
      </div>
    </div>

    <footer id="wizard-footer" class="wizard-footer" hidden>
      <div class="wizard-footer-inner">
        <button type="button" class="wizard-btn wizard-btn-back" id="wizard-back" data-haptic="none" hidden>
          <span class="wizard-btn-icon" aria-hidden="true" data-icon="chevronLeft"></span>
          <span id="wizard-back-label" data-i18n="create.back">Back</span>
        </button>
        <button type="button" class="wizard-btn wizard-btn-next full" id="wizard-next">
          <span id="wizard-next-label" data-i18n="create.next">Next</span>
          <span class="wizard-btn-icon" id="wizard-next-icon" aria-hidden="true" data-icon="chevronRight"></span>
          <span class="wizard-btn-spinner" id="wizard-next-spinner" hidden></span>
        </button>
      </div>
    </footer>

    <input type="file" id="photo-input" accept="image/*" multiple hidden />

    <script src="../assets/uydosh-core.js?v=20260705-98"></script>
    <script src="../assets/uydosh-api.js?v=20260706-100"></script>
    <script src="../assets/uydosh-i18n.js?v=20260706-26"></script>
    <script src="../assets/uydosh-icons.js?v=20260706-104"></script>
    <script src="../assets/uydosh-map-pins.js?v=20260705-81"></script>
    <script src="../assets/uydosh-badges.js?v=20260703-67"></script>
    <script src="../assets/uydosh-mini-app.js?v=20260705-100"></script>
    <script src="../assets/telegram-create.js?v=20260705-104"></script>
  </body>
</html>
