<!doctype html>
<html lang="ru" class="mini-app">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>UyDosh — Управление афишей</title>
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <script src="../assets/theme-init.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link rel="stylesheet" href="../assets/loading-spinner.css" />
    <link rel="stylesheet" href="../assets/telegram-shared.css" />
    <link rel="stylesheet" href="../assets/telegram-events.css" />
  </head>
  <body>
    <div class="wrap">
      <header data-uydosh-mini-app-header></header>
      <main class="radar-page">
        <a href="/telegram/admin.html">← Управление</a>
        <h1>Афиша</h1>
        <p>Источники, проверка и публикация мероприятий</p>
        <div id="radar-status" role="status" aria-live="polite">
          Проверяем доступ…
        </div>
        <section id="radar-admin" hidden>
          <nav class="radar-actions" aria-label="Разделы афиши">
            <button data-section="sources">Источники</button
            ><button data-section="drafts">Черновики</button
            ><button data-section="events">Публикации</button>
          </nav>
          <label id="draft-filter-label" hidden
            >Статус черновика
            <select id="draft-filter">
              <option value="needs_review">На проверке</option>
              <option value="accepted">Приняты</option>
              <option value="rejected">Отклонены</option>
              <option value="duplicate">Дубликаты</option>
            </select></label
          ><button id="radar-retry">Обновить</button>
          <div id="radar-editor"></div>
          <div id="radar-list" class="radar-list"></div>
          <div class="radar-actions">
            <button id="radar-prev">Назад</button><span id="radar-page"></span
            ><button id="radar-next">Далее</button>
          </div>
        </section>
      </main>
    </div>
    <script src="../assets/uydosh-core.js"></script>
    <script src="../assets/uydosh-i18n.js"></script>
    <script src="../assets/uydosh-api.js" defer></script>
    <script src="../assets/uydosh-icons.js" defer></script>
    <script src="../assets/uydosh-mini-app.js" defer></script>
    <script src="../assets/city-radar-ui.js" defer></script>
    <script src="../assets/telegram-admin-events.js" defer></script>
  </body>
</html>
