name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify latest publication run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/stamp-build.cjs --guard
      - name: Test build versioning
        run: node --test tests/build-version.test.cjs tests/build-info.test.cjs
      - name: Minify JS/CSS assets
        run: bash scripts/minify-assets.sh
      - name: Stamp release metadata and asset versions
        run: node scripts/stamp-build.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Prevent an older run from replacing a newer release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/stamp-build.cjs --guard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
