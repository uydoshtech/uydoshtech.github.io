    <meta charset="utf-8" />

    <title>UyDosh — E’lon</title>
    <meta name="description" content="UyDosh e’lon tafsilotlari." />
    <meta property="og:title" content="UyDosh — E’lon" id="og-title" />
    <meta property="og:description" content="Ijara e’loni tafsilotlari." id="og-desc" />
    <meta property="og:type" content="article" />
    <meta property="og:image" content="https://uydoshtech.github.io/images/og-image.png" id="og-image" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="uydosh-api-base" content="https://api.uydosh.com" />
    <meta name="uydosh-yandex-maps-key" content="70aaf6ac-5a4b-4a69-a5a5-c16536483324" />
    <script src="assets/theme-init.js?v=20260711-1"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="stylesheet" href="assets/listing-detail.css?v=20260711-2" />
  </head>
  <body>
    <div class="wrap">
      <!-- Hidden in Mini App — the listing photo should sit right at the top,
           with no logo/tagline/theme-toggle header above it (see
           data-hide-in-mini-app). Still shown on the regular website. -->
      <header data-hide-in-mini-app>
        <a class="brand" href="index.html" data-mini-app-home>
          <img src="images/uydosh-logo.svg" alt="UyDosh" />
          <div>
            <strong>UyDosh</strong>
            <span data-i18n="brand.tagline">Keling Birga Yashaymiz!</span>
          </div>
        </a>
        <nav>
          <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="uz" aria-pressed="true" aria-label="O'zbekcha"><span class="flag" aria-hidden="true">🇺🇿</span></button>
            <button type="button" data-lang="ru" aria-pressed="false" aria-label="Русский"><span class="flag" aria-hidden="true">🇷🇺</span></button>
            <button type="button" data-lang="en" aria-pressed="false" aria-label="English"><span class="flag" aria-hidden="true">🇬🇧</span></button>
          </div>
          <span class="site-nav-links">
            <a class="pill" href="index.html" data-i18n="nav.home">Asosiy</a>
            <a class="pill" href="listings.html" data-i18n="nav.listings">E’lonlar</a>
          </span>
        </nav>
      </header>

      <!-- Hidden in Mini App — Telegram header BackButton handles navigation (see data-hide-in-mini-app). -->
      <a class="back" href="listings.html" data-mini-app-back data-hide-in-mini-app>
        <span class="back-icon" aria-hidden="true" data-icon="chevronLeft"></span>
        <span data-i18n="nav.listings">E’lonlar</span>
      </a>

      <main id="root">
        <!-- Skeleton while loading -->
        <div class="layout" id="skeleton-view">
          <div class="gallery-col">
            <div class="skel gallery-skel gallery-skel-rounded"></div>
          </div>
          <div class="details">
            <div class="skel line w80"></div>
            <div class="skel line w40"></div>
            <div class="skel line w60 short"></div>
            <div class="skel line w80 short"></div>
            <div class="skel line w60 short"></div>
          </div>
        </div>
      </main>

      <footer>
        <div>© <span id="y"></span> UyDosh</div>
        <div class="links site-footer-links">
          <a href="index.html" data-i18n="nav.home">Asosiy</a>
          <a href="listings.html" data-i18n="nav.listings">E’lonlar</a>
          <a href="privacy-policy.html" data-i18n="nav.privacy">Maxfiylik</a>
          <a href="terms-of-service.html" data-i18n="nav.terms">Foydalanish shartlari</a>
          <a href="mailto:uydoshtech@gmail.com" data-i18n="nav.contact">Aloqa</a>
        </div>
      </footer>
    </div>

    <div id="detail-contact-bar" class="detail-contact-bar" hidden aria-hidden="true"></div>

    <!-- Mini App only — extra always-visible way back to the feed alongside the
         Telegram header BackButton, kept clear of the sticky contact bar above
         (see .detail-back-fab / html.has-detail-contact in listing-detail.css). -->
    <button
      type="button"
      id="detail-back-fab"
      class="detail-back-fab"
      hidden
      data-icon="chevronLeft"
      data-i18n="create.back"
      data-i18n-attr="aria-label"
      aria-label="Back"
    ></button>

    <div id="complaint-backdrop" class="complaint-backdrop" hidden aria-hidden="true"></div>
    <div id="listing-complaints-backdrop" class="complaint-backdrop" hidden aria-hidden="true"></div>
    <div id="roomscan-backdrop" class="roomscan-backdrop" hidden aria-hidden="true"></div>

    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="assets/uydosh-core.js?v=20260709-102"></script>
    <script src="assets/uydosh-i18n.js?v=20260710-1"></script>
    <script src="assets/uydosh-api.js?v=20260709-117" defer></script>
    <script src="assets/uydosh-icons.js?v=20260709-110" defer></script>
    <script src="assets/uydosh-map-pins.js?v=20260709-4" defer></script>
    <script src="assets/uydosh-badges.js?v=20260709-68" defer></script>
    <script src="assets/uydosh-profile-match.js?v=20260705-1" defer></script>
    <script src="assets/uydosh-mini-app.js?v=20260710-1" defer></script>
    <script src="assets/listing-detail-gallery.js?v=20260711-1" defer></script>
    <script src="assets/listing-detail-map.js?v=20260711-1" defer></script>
    <script src="assets/listing-detail-roomscan.js?v=20260711-1" defer></script>
    <script src="assets/listing-detail-complaints.js?v=20260711-1" defer></script>
    <script src="assets/listing-detail-actions.js?v=20260711-1" defer></script>
    <script src="assets/listing-detail-compat.js?v=20260711-1" defer></script>
    <script src="assets/listing-detail.js?v=20260711-2" defer></script>
  </body>
</html>
