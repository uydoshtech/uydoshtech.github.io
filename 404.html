<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UyDosh</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        max-width: 560px;
        width: 100%;
        border: 1px solid rgba(127,127,127,0.25);
        border-radius: 16px;
        padding: 18px 16px;
      }
      a { color: inherit; }
      code { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="card">
      <strong>Opening UyDosh…</strong>
      <div style="margin-top: 10px; opacity: 0.8">
        If nothing happens, go to <a href="index.html">home</a>.
      </div>
      <div style="margin-top: 10px; opacity: 0.7; font-size: 13px">
        <div>Path: <code id="p"></code></div>
      </div>
    </div>

    <script>
      (function () {
        var path = window.location.pathname || "/";
        document.getElementById("p").textContent = path;

        var m = path.match(/^\/listing\/(\d+)(?:\/)?$/);
        if (!m) {
          window.location.replace("/index.html");
          return;
        }

        var id = m[1];
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
          || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        function openWebListing() {
          window.location.replace("/listing.html?id=" + encodeURIComponent(id));
        }

        if (isIOS) {
          window.location.href = "uydosh://listing/" + encodeURIComponent(id);
          setTimeout(openWebListing, 1200);
          return;
        }

        window.location.href = "uydosh://listing/" + encodeURIComponent(id);
        setTimeout(openWebListing, 1200);
      })();
    </script>
  </body>
</html>
